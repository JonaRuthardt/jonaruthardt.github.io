<div class="repo p-2">
  <a class="repository-card" href="https://github.com/{{ site.data.repositories.github_users.first }}/{{ include.repository.name }}">
    <span class="repository-card-title">{{ include.repository.name }}</span>
    <span class="repository-card-description">{{ include.repository.description }}</span>
    <span class="repository-card-meta">
      {% if include.repository.language %}<span><i class="fas fa-circle" aria-hidden="true"></i> {{ include.repository.language }}</span>{% endif %}
      <span><i class="fas fa-star" aria-hidden="true"></i> {{ include.repository.stars }}</span>
      <span><i class="fas fa-code-branch" aria-hidden="true"></i> {{ include.repository.forks }}</span>
    </span>
  </a>
</div>
