<div class="repo p-2 text-center">
  <a class="repository-card profile-card" href="https://github.com/{{ include.username }}">
    <i class="fab fa-github fa-2x" aria-hidden="true"></i>
    <span class="repository-card-title">{{ include.username }}</span>
    <span class="repository-card-description">View my public repositories, contributions, and activity on GitHub.</span>
    <span class="repository-card-link">Visit GitHub profile <i class="fas fa-arrow-right" aria-hidden="true"></i></span>
  </a>
</div>
